<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#2b1b17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Éclair Paris" />
  <title>Éclair Paris</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">PARIS · ÉCLAIRS AU CHOCOLAT</div>
      <h1>Éclair Paris</h1>
    </div>
    <div class="top-actions">
      <button id="authBtn" class="pill-btn">Connexion</button>
      <button id="locateBtn" class="icon-btn" aria-label="Me localiser">⌖</button>
    </div>
  </header>

  <nav class="tabs" aria-label="Navigation">
    <button class="tab active" data-view="map">Carte</button>
    <button class="tab" data-view="ranking">Classement</button>
    <button class="tab" data-view="discover">À tester</button>
  </nav>

  <main>
    <section id="mapView" class="view active">
      <div class="filters">
        <input id="searchInput" type="search" placeholder="Nom, adresse, arrondissement…" autocomplete="off" />
        <select id="arrFilter"><option value="">Tout Paris</option></select>
        <select id="statusFilter">
          <option value="">Tous</option>
          <option value="verified">Éclair vérifié</option>
          <option value="unknown">À vérifier</option>
        </select>
      </div>
      <div id="map"></div>
      <div id="mapCount" class="map-count"></div>
    </section>

    <section id="rankingView" class="view">
      <div class="section-head">
        <div><div class="eyebrow">COMMUNAUTÉ</div><h2>Classement</h2></div>
        <select id="rankingArr"><option value="">Tout Paris</option></select>
      </div>
      <div id="rankingList" class="cards"></div>
    </section>

    <section id="discoverView" class="view">
      <div class="section-head">
        <div><div class="eyebrow">MA LISTE</div><h2>À tester</h2></div>
      </div>
      <div id="favoriteList" class="cards"></div>
    </section>
  </main>

  <dialog id="detailDialog">
    <button id="closeDialog" class="close">×</button>
    <div id="detailContent"></div>
  </dialog>

  <dialog id="authDialog">
    <button id="closeAuth" class="close">×</button>
    <div class="eyebrow">MON COMPTE</div>
    <h2>Connexion</h2>
    <p class="meta">Connecte-toi pour voter et créer ta liste d'éclairs à tester.</p>
    <form id="authForm" class="form-grid">
      <label>Email<input id="authEmail" type="email" required autocomplete="email"></label>
      <label>Mot de passe<input id="authPassword" type="password" required minlength="6" autocomplete="current-password"></label>
      <div class="actions">
        <button type="submit" class="primary">Se connecter</button>
        <button type="button" id="signupBtn" class="secondary">Créer un compte</button>
      </div>
      <div id="authMessage" class="meta"></div>
    </form>
  </dialog>

  <dialog id="voteDialog">
    <button id="closeVote" class="close">×</button>
    <div class="eyebrow">DÉGUSTATION</div>
    <h2 id="voteTitle">Noter l'éclair</h2>
    <form id="voteForm" class="form-grid">
      <div id="voteSliders"></div>
      <label>Commentaire<textarea id="voteComment" rows="3" placeholder="Texture, intensité du chocolat, équilibre…"></textarea></label>
      <label class="check"><input id="verifiedTasting" type="checkbox"> Je suis actuellement près de la boutique</label>
      <div class="score-preview">Note calculée : <strong id="scorePreview">0/100</strong></div>
      <button type="submit" class="primary">Enregistrer mon vote</button>
      <div id="voteMessage" class="meta"></div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="./app.js"></script>
</body>
</html>
