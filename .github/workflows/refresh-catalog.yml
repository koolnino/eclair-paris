name: Refresh Paris bakeries catalog

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/import_paris_osm.py"
      - ".github/workflows/refresh-catalog.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: pip install requests
      - name: Fetch Paris bakeries and pastry shops from OpenStreetMap
        run: python scripts/import_paris_osm.py
      - name: Commit refreshed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paris_shops.json
          git diff --cached --quiet || git commit -m "Refresh Paris bakery catalog"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
